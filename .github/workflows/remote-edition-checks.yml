name: Remote Edition checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate remote controls and IR files
        run: python3 tools/remote_edition/validate.py
      - name: Test upstream merge safety
        run: python3 tools/remote_edition/test_sync.py
